name: open-rush-benchmark
services:
  redis:
    image: redis:8.2.11-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: open_rush_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - benchmark-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d open_rush_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  benchmark-data:
