spring:
  application:
    name: open-rush
  datasource:
    url: jdbc:postgresql://localhost:5432/open_rush
    username: open_rush
    password: open_rush
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
reservation:
  expiration:
    enabled: true
    fixed-delay: 10s
    initial-delay: 10s
    batch-size: 100
    lock-timeout-ms: 1000
