spring:
  application:
    name: open-rush
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  datasource:
    url: jdbc:postgresql://localhost:5432/open_rush
    username: open_rush
    password: open_rush
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    openfeign:
      httpclient:
        max-connections: 8
        max-connections-per-route: 8
        hc5:
          connection-request-timeout: 200
          connection-request-timeout-unit: milliseconds
      client:
        config:
          demo-pg:
            connect-timeout: 300
            read-timeout: 700
            follow-redirects: false
reservation:
  approval-recovery:
    enabled: true
    fixed-delay: 1s
    initial-delay: 1s
  refund:
    enabled: true
    fixed-delay: 1s
    initial-delay: 1s
  hold-duration-ms: 300000
  expiration:
    enabled: true
    fixed-delay: 10s
    initial-delay: 10s
    batch-size: 100
    lock-timeout-ms: 1000

queue:
  enabled: false
  admissions-per-second: 20
  max-in-flight: 16
  capacity: 10000
  wait-ttl-ms: 120000
  permit-ttl-ms: 10000
  processing-ttl-ms: 30000
  cleanup-batch-size: 100
  key-prefix: "queue:{reservation}"
  advance-interval: 10ms

management:
  health:
    redis:
      enabled: ${queue.enabled}

payment:
  demo-pg:
    base-url: ${PAYMENT_DEMO_PG_BASE_URL:http://127.0.0.1:8082}
