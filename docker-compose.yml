name: open-rush

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: open_rush
      POSTGRES_USER: open_rush
      POSTGRES_PASSWORD: open_rush
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
