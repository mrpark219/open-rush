name: open-rush

services:
  redis:
    image: redis:8.2.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: open_rush
      POSTGRES_USER: open_rush
      POSTGRES_PASSWORD: open_rush
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  demo-pg:
    image: mrpark219/demo-pg:0.1.0
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - demo-pg-data:/var/lib/mysql

volumes:
  redis-data:
  postgres-data:
  demo-pg-data:
